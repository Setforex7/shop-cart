name: CI backend

on:
  push:
    branches: [main]
    paths:
      - 'srv/**'
      - 'db/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - '.cdsrc.json'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'srv/**'
      - 'db/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - '.cdsrc.json'
      - '.github/workflows/ci-backend.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (Jest)
        run: npm test
