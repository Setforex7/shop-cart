name: CI cap_try

on:
  push:
    branches: [main]
    paths:
      - 'app/cap_try/**'
      - 'eslint.config.mjs'
      - '.github/workflows/ci-cap_try.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/cap_try/**'
      - 'eslint.config.mjs'
      - '.github/workflows/ci-cap_try.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The root ESLint config also covers app/cap_try's JS sources, so a scoped
  # lint runs here — otherwise cap_try-only changes would go unlinted.
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Lint (root ESLint, scoped to cap_try)
        run: npx eslint app/cap_try

  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/cap_try

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/cap_try/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test (QUnit via Karma)
        run: npm test
