name: CI cap_try_ts

on:
  push:
    branches: [main]
    paths:
      - 'app/cap_try_ts/**'
      - '.github/workflows/ci-cap_try_ts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/cap_try_ts/**'
      - '.github/workflows/ci-cap_try_ts.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/cap_try_ts

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: app/cap_try_ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run ts-typecheck

      - name: Lint (ui5lint)
        run: npm run lint

      - name: Test (QUnit via Karma)
        run: npm test
