<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>cap_try_ts</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <!-- SheetJS (community build) for the Excel import in service/FileService.ts.
         Loaded as a plain global script before the UI5 bootstrap so that window.XLSX
         is available. Replaces the deprecated sap.ui5/resources/js manifest entry
         that was removed during the manifest v2 migration. -->
    <script src="util/xlsx.full.min.js"></script>
    <script
        id="sap-ui-bootstrap"
        src="https://sapui5.hana.ondemand.com/1.136.2/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon_dark"
        data-sap-ui-resource-roots='{
            "cap_try_ts": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="cap_try_ts"
        data-id="container"
        data-settings='{"id" : "cap_try_ts"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
